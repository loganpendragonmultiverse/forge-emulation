[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-emulation"
version = "1.2.0"
description = "A local-first Windows library and runtime for legally obtained retro games."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
dependencies = [
    "PySide6==6.11.2",
    "pygame-ce==2.5.8",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "PyInstaller==6.22.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]

[project.scripts]
forge-emulation = "forge_emulation.app:main"
forge-emulation-runtime = "forge_emulation.runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=forge_emulation --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "src/forge_emulation/app.py",
    "src/forge_emulation/runtime.py",
    "src/forge_emulation/ui/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["forge_emulation"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pygame.*"]
ignore_missing_imports = true
