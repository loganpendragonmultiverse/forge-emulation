name: Release build

on:
  push: { tags: ["v*"] }

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Build verified Windows release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          .\scripts\build_release.ps1 -Version $version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ForgeEmulation-${{ github.ref_name }}-windows-x64
          path: |
            release/ForgeEmulation-*-windows-x64.zip
            release/ForgeEmulation-*-windows-x64.zip.sha256
          if-no-files-found: error
